# Apache Virtual Host Configuration
# Place this in your Apache configuration or create a new .conf file

<VirtualHost *:80>
    ServerName react-components.local
    DocumentRoot "/Users/apple/Desktop/System Data/Param Network/reusable_react_lib/dist"
    
    <Directory "/Users/apple/Desktop/System Data/Param Network/reusable_react_lib/dist">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Handle React Router (if you're using client-side routing)
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
    
    # Optional: Enable compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
    </IfModule>
    
    ErrorLog "/var/log/apache2/react-components-error.log"
    CustomLog "/var/log/apache2/react-components-access.log" combined
</VirtualHost>

# HTTPS version (optional)
<VirtualHost *:443>
    ServerName react-components.local
    DocumentRoot "/Users/apple/Desktop/System Data/Param Network/reusable_react_lib/dist"
    
    # SSL Configuration (you'll need to set up certificates)
    SSLEngine on
    # SSLCertificateFile /path/to/your/certificate.crt
    # SSLCertificateKeyFile /path/to/your/private.key
    
    <Directory "/Users/apple/Desktop/System Data/Param Network/reusable_react_lib/dist">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
</VirtualHost> 